{% extends 'base.html' %}

    {% block content%}
    <!-- Conteudo Principal -->
    <main class="container py-4">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">

                <!-- Breadcrumb -->
                <nav aria-label="breadcrumb" class="mb-3">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item">
                            <a href="index.html" class="text-decoration-none">
                                <i class="bi bi-house-door"></i> Tarefas
                            </a>
                        </li>
                        <li class="breadcrumb-item active" aria-current="page">Nova Tarefa</li>
                    </ol>
                </nav>

                <!-- Card do Formulario -->
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">
                            <i class="bi bi-plus-circle"></i> Nova Tarefa
                        </h5>
                    </div>
                    <div class="card-body p-4">

                        <!-- Formulario -->
                        <form method="POST" action="/tarefas/nova/" id="formTarefa">

                            <!-- Titulo -->
                            <div class="mb-3">
                                <label for="titulo" class="form-label fw-semibold">
                                    Titulo <span class="text-danger">*</span>
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="bi bi-type"></i>
                                    </span>
                                    <input
                                        type="text"
                                        class="form-control"
                                        id="titulo"
                                        name="titulo"
                                        placeholder="Digite o titulo da tarefa"
                                        required
                                        maxlength="100"
                                    >
                                </div>
                                <div class="form-text">Maximo de 100 caracteres.</div>
                            </div>


                            <!-- Categoria e Status -->
                            
                                <div class="mb-3">
                                    <label for="disciplina" class="form-label fw-semibold">
                                        <i class="bi bi-pencil-square"></i> Disciplina
                                    </label>
                                    <select class="form-select" id="categoria" name="categoria">
                                        <option value="">Selecione...</option>
                                        <option value="estudo">Português</option>
                                        <option value="trabalho">Matemática</option>
                                        <option value="pessoal">Autoria Web</option>
                                        <option value="configuracao">História</option>
                                    </select>
                                </div>

                                <div class="mb-3">
                                    <label for="status" class="form-label fw-semibold">
                                        <i class="bi bi-flag"></i> Status
                                    </label>
                                    <select class="form-select" id="status" name="status">
                                        <option value="pendente" selected>Pendente</option>
                                        <option value="em_andamento">Em Andamento</option>
                                        <option value="concluida">Concluida</option>
                                    </select>
                                </div>
                            

                            <!-- Prazo -->
                            <div class="mb-3">
                                <label for="prazo" class="form-label fw-semibold">
                                    <i class="bi bi-calendar-event"></i> Prazo
                                </label>
                                <input
                                    type="date"
                                    class="form-control"
                                    id="prazo"
                                    name="prazo"
                                >
                            </div>

                            <!-- Botoes -->
                            <div class="d-flex justify-content-between mt-4">
                                <a href="/tarefas/" class="btn btn-outline-danger">
                                    <i class="bi bi-arrow-left"></i> Cancelar
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-floppy"></i> Salvar Atividade
                                </button>
                            </div>
                        </form>

                    </div>
                </div>

            
            </div>
        </div>
    </main>

    {%endblock%}
