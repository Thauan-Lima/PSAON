{% extends 'base.html' %}

    {% block content%}
    <!-- Main Content -->
    <main class="container py-4">

        <!-- Cards de resumo -->
        <div class="row g-3 mb-4">
            <div class="col-md-3">
                <div class="card text-white bg-primary shadow-sm">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="card-subtitle mb-1 text-white-50">Total</h6>
                            <h2 class="card-title mb-0" id="contador-total"></h2>
                        </div>
                        <i class="bi bi-clipboard-check fs-1"></i>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-warning shadow-sm">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="card-subtitle mb-1 text-white-50">Pendentes</h6>
                            <h2 class="card-title mb-0"  id="contador-pendentes"></h2>
                        </div>
                        <i class="bi bi-clock-history fs-1"></i>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-info shadow-sm">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="card-subtitle mb-1 text-white-50">Em Andamento</h6>
                            <h2 class="card-title mb-0" id="contador-andamento"></h2>
                        </div>
                        <i class="bi bi-arrow-repeat fs-1"></i>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-success shadow-sm">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="card-subtitle mb-1 text-white-50">Concluidas</h6>
                            <h2 class="card-title mb-0" id="contador-concluidas"></h2>
                        </div>
                        <i class="bi bi-check2-circle fs-1"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- Barra de acoes -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="mb-0"><i class="bi bi-list-task text-primary"></i> Minhas Tarefas</h4>
            <div class="d-flex gap-2">
                <div class="input-group input-group-sm" style="width: 250px;">
                    <span class="input-group-text bg-white">
                        <i class="bi bi-search"></i>
                    </span>
                    <input type="text" class="form-control" id="buscaTarefa" placeholder="Buscar tarefa...">
                    <button class="btn btn-outline-secondary d-none" type="button" id="btnLimparBusca" onclick="limparBusca()">
                        <i class="bi bi-x-lg"></i>
                    </button>
                </div>
                <a href="{% url 'criar_tarefa' %}" class="btn btn-primary btn-sm">
                    <i class="bi bi-plus-lg"></i> Nova Tarefa
                </a>
            </div>
        </div>

        <!-- Tabela de tarefas -->
       

        <!-- Mensagem quando nao ha resultados -->
        <div id="semResultados" class="text-center py-4 d-none">
            <i class="bi bi-inbox fs-1 text-muted"></i>
            <p class="text-muted mt-2">Nenhuma tarefa encontrada.</p>
        </div>

    </main>

    {%endblock%}
